name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Validate locale files and icon
        shell: pwsh
        run: |
          Get-Content locale/en.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content locale/zh.json -Raw | ConvertFrom-Json | Out-Null
          [xml](Get-Content icon.svg -Raw) | Out-Null
