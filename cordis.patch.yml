# dsh-remote bundle patch.
# The WSL target is a starting point; add SSH targets under `targets` or use the
# ad-hoc forms `ssh:<alias>` / `ssh://user@host:port` without any config change.
- insert:
    - id: dsh-remote
      name: '@char0nchengg/dsh-remote'
      config:
        targets:
          - id: wsl-ubuntu
            label: WSL Ubuntu
            transport: wsl
            distro: Ubuntu
            defaultCwd: "~"
            environment: "Local WSL distro; no sshd required. Use the distro's default user."
        # SSH example:
        # - id: myserver
        #   label: Example server
        #   transport: ssh
        #   host: server.example.edu
        #   user: Username
        #   port: 22
        #   identityFile: C:\Users\Username\.ssh\id_ed25519
        #   defaultCwd: /home/Username/project
        defaultTimeoutMs: 120000
        maxOutputBytes: 262144
